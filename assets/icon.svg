<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>CpuZeeZ</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0B1023"/>
    </linearGradient>
    <linearGradient id="z" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="8"/>

  <!-- pins: 4 per side, centred on 347/457/567/677 -->
  <g fill="#E0E7FF">
    <rect x="320" y="132" width="54" height="130" rx="22"/>
    <rect x="430" y="132" width="54" height="130" rx="22"/>
    <rect x="540" y="132" width="54" height="130" rx="22"/>
    <rect x="650" y="132" width="54" height="130" rx="22"/>
    <rect x="320" y="762" width="54" height="130" rx="22"/>
    <rect x="430" y="762" width="54" height="130" rx="22"/>
    <rect x="540" y="762" width="54" height="130" rx="22"/>
    <rect x="650" y="762" width="54" height="130" rx="22"/>
    <rect x="132" y="320" width="130" height="54" rx="22"/>
    <rect x="132" y="430" width="130" height="54" rx="22"/>
    <rect x="132" y="540" width="130" height="54" rx="22"/>
    <rect x="132" y="650" width="130" height="54" rx="22"/>
    <rect x="762" y="320" width="130" height="54" rx="22"/>
    <rect x="762" y="430" width="130" height="54" rx="22"/>
    <rect x="762" y="540" width="130" height="54" rx="22"/>
    <rect x="762" y="650" width="130" height="54" rx="22"/>
  </g>

  <!-- package -->
  <rect x="232" y="232" width="560" height="560" rx="84" fill="url(#die)"/>
  <rect x="232" y="232" width="560" height="560" rx="84" fill="none" stroke="#A5B4FC" stroke-opacity="0.55" stroke-width="10"/>
  <circle cx="298" cy="298" r="18" fill="#A5B4FC" fill-opacity="0.7"/>

  <!-- Z with a pink echo behind it: "ZeeZ" -->
  <path d="M352 352 H672 V430 L478 594 H672 V672 H352 V594 L546 430 H352 Z" fill="#F472B6" fill-opacity="0.9" transform="translate(26 26)"/>
  <path d="M352 352 H672 V430 L478 594 H672 V672 H352 V594 L546 430 H352 Z" fill="url(#z)"/>
</svg>
