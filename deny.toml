# cargo-deny policy (docs/v1/dependencies.md §2.2, docs/adr/0006).
# Run: cargo deny check

[graph]
all-features = true

[advisories]
# RustSec database: known vulnerabilities and unmaintained crates fail CI.
version = 2
yanked = "deny"
# Tracked exceptions: each says why it is acceptable and when to revisit.
ignore = [
  # zbus 5's helper crates were flagged unmaintained (the project moved on to
  # zbus 6). Not vulnerabilities; only the Linux tray (ksni 0.3.7, still on
  # zbus 5) uses them. Revisit when ksni moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant via ksni/zbus 5; notice, not a vulnerability" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via ksni/zbus 5; notice, not a vulnerability" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via ksni/zbus 5; notice, not a vulnerability" },
]

[licenses]
version = 2
# What may be linked into an MIT OR Apache-2.0 binary. No GPL/LGPL.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "OFL-1.1",
]
confidence-threshold = 0.9
# Permissive licenses accepted for one crate each.
exceptions = [
  # egui's bundled fonts (Ubuntu-Light, Hack, Noto Emoji): a font license that allows redistribution.
  { crate = "epaint_default_fonts", allow = ["Ubuntu-font-1.0"] },
  # The Linux tray (StatusNotifierItem); public-domain dedication.
  { crate = "ksni", allow = ["Unlicense"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
