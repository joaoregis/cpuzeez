[package]
name = "cpuzeez"
version = "1.1.0-beta.1"
edition = "2024"
rust-version = "1.95"
description = "Clean-room, cross-platform reimplementation of CPU-Z's hardware information features"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joaoregis/cpuzeez"
readme = "README.md"
keywords = ["cpu", "hardware", "cpuid", "spd", "system-information"]
categories = ["command-line-utilities", "hardware-support"]
# Installed from GitHub releases or `cargo install --git`; not published to crates.io.
publish = false
authors = ["Joao Regis <22204842+joaoregis@users.noreply.github.com>"]

[workspace]
members = ["crates/*"]
# Fuzzing needs nightly and libFuzzer; see fuzz/Cargo.toml.
exclude = ["fuzz"]

[dependencies]
cpuzeez-core = { path = "crates/core" }
cpuzeez-platform = { path = "crates/platform" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11", "links"], optional = true }
png = { version = "0.18", optional = true }
# App history (docs/v1/dependencies.md §2.2, Q6a): SQLite compiled in, no system library.
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
# ZeeZ Live hotkeys on Windows, macOS and X11 (docs/v1/dependencies.md §2.2).
global-hotkey = { version = "0.9", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# Tray / menu-bar mini monitor (no gtk/xdo features: those are its Linux
# backend, which we don't use; Linux has its own tray through ksni).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, optional = true }

# Linux: StatusNotifierItem over D-Bus, pure Rust (zbus + async-io, no system libs).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"], optional = true }
# The GlobalShortcuts portal on Wayland (ADR 0015). Already in the tree through ksni.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[features]
default = ["gui"]
# Test hooks for the long-running soak (docs/testing/soak.md): a synthetic game
# and an automatic tour of every page. Never in a release.
soak = []
gui = ["dep:eframe", "dep:png", "dep:rusqlite", "dep:global-hotkey", "dep:tray-icon", "dep:ksni", "dep:zbus"]


[package.metadata.deb]
maintainer = "Joao Regis <22204842+joaoregis@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
cpuzeez shows detailed processor, cache, mainboard, memory (incl. SPD), \
GPU, storage and sensor information, like CPU-Z, and exports TXT/HTML/JSON \
reports. Run as root for MSR, SPD and full PCI configuration access."""
assets = [
  ["target/release/cpuzeez", "usr/bin/", "755"],
  ["packaging/linux/cpuzeez.desktop", "usr/share/applications/", "644"],
  ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/cpuzeez.svg", "644"],
  ["assets/icon-32.png", "usr/share/icons/hicolor/32x32/apps/cpuzeez.png", "644"],
  ["assets/icon-48.png", "usr/share/icons/hicolor/48x48/apps/cpuzeez.png", "644"],
  ["assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/cpuzeez.png", "644"],
  ["assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/cpuzeez.png", "644"],
  ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/cpuzeez.png", "644"],
  ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/cpuzeez.png", "644"],
  ["README.md", "usr/share/doc/cpuzeez/", "644"],
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# GUI interaction tests through the accessibility tree (S0-T05). Tests run on
# stable Rust; rust-version above is what building the app needs.
[dev-dependencies]
egui_kittest = "0.36"

[build-dependencies]
winresource = "0.1"
