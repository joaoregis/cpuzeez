name: Nightly

# Long-running checks that don't fit in every push (S0-T10).
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Soak duration in minutes"
        default: "60"

# Read-only token: nothing here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  soak:
    name: Soak (sampler for an hour, memory and fds must plateau)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release
      - run: python3 .github/scripts/soak.py target/release/cpuzeez ${{ inputs.minutes || 60 }}
