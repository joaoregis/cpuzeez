name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read-only token: nothing here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: Ubuntu x64, os: ubuntu-latest }
          - { name: Ubuntu arm64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings  # per-OS items carry their own cfg
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: Tests (nextest names a stuck test and kills it after 120 s)
        timeout-minutes: 20
        run: cargo nextest run --workspace --all-targets --profile ci
      - run: cargo test --workspace --doc
        timeout-minutes: 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - name: Workflow files GitHub would refuse (duplicate keys)
        run: |
          python -m pip install --quiet pyyaml
          python .github/scripts/lint_workflows.py
      - name: No new unsafe outside platform (the ratchet only goes down)
        run: |
          python .github/scripts/unsafe_ratchet.py --selftest
          python .github/scripts/unsafe_ratchet.py
      - name: Soak hooks (the synthetic game) and the soak analysis itself
        run: |
          cargo test --bin cpuzeez --features soak soak
          python .github/scripts/soak.py --selftest
      - name: Build release
        run: cargo build --release
      - name: Static C runtime (starts without the VC++ redistributable)
        if: runner.os == 'Windows'
        run: python .github/scripts/check_no_crt.py target/release/cpuzeez.exe
      - name: Run every report format (real hardware of the runner)
        shell: bash
        run: |
          set -e
          bin=target/release/cpuzeez
          $bin -txt=out/report -html=out/report -json=out/report
          $bin -console | head -n 80
          $bin -core=0
          test -s out/report.txt && test -s out/report.html && test -s out/report.json
          python3 -c "import json,sys; d=json.load(open('out/report.json')); print(len(d), 'sections:', [s['title'] for s in d])"
      - name: Works with no network at all (P1)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          # A network namespace with only loopback, down: any connection attempt fails.
          sudo unshare -n -- target/release/cpuzeez -txt=out/nonet -json=out/nonet
          sudo unshare -n -- target/release/cpuzeez -sensors | head -n 5
          test -s out/nonet.txt && test -s out/nonet.json
      - name: Benchmark smoke test
        shell: bash
        run: target/release/cpuzeez -bench
      - name: GUI screenshots (every tab)
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libxkbcommon-x11-0 libgl1 libegl1 libgl1-mesa-dri >/dev/null
            xvfb-run -a -s "-screen 0 1280x1024x24" target/release/cpuzeez -screenshots=out/screenshots
          else
            target/release/cpuzeez -screenshots=out/screenshots
          fi
      - name: GUI on Wayland (headless Weston)
        if: runner.os == 'Linux'
        # A normal run takes ~1 min. Rarely (5e49edf, da4c3e8) the app or headless
        # Weston stalls and nothing gets logged, so each attempt is bounded, gets a
        # fresh compositor, prints where it stopped, and is retried once.
        timeout-minutes: 7
        shell: bash
        run: |
          set -e
          sudo apt-get install -y -qq weston mesa-vulkan-drivers libwayland-egl1 >/dev/null
          attempt() {
            export XDG_RUNTIME_DIR=$(mktemp -d); chmod 700 "$XDG_RUNTIME_DIR"
            rm -rf out/wayland
            weston --backend=headless --socket=wayland-cz --width=1280 --height=1024 &
            local weston_pid=$!
            for i in $(seq 50); do test -S "$XDG_RUNTIME_DIR/wayland-cz" && break; sleep 0.1; done
            local rc=0
            env -u DISPLAY WAYLAND_DISPLAY=wayland-cz \
              timeout --kill-after=10 150 target/release/cpuzeez -screenshots=out/wayland \
              > "out/wayland-attempt$1.log" 2>&1 || rc=$?
            kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true
            echo "::group::attempt $1 (exit $rc), last log lines"
            tail -n 25 "out/wayland-attempt$1.log"
            echo "screenshots: $(ls out/wayland 2>/dev/null | wc -l)"
            echo "::endgroup::"
            return $rc
          }
          mkdir -p out
          if ! attempt 1; then
            echo "::warning::Wayland GUI attempt 1 failed or stalled; retrying once with a fresh Weston"
            attempt 2
          fi
          test -s out/wayland/overview.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.os }}
          path: out/

  distros:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable", "ubuntu:22.04", "archlinux:latest"]
    steps:
      - name: Install toolchain prerequisites
        run: |
          if command -v pacman >/dev/null; then
            for i in 1 2 3; do
              pacman -Syu --noconfirm --needed base-devel curl git python && break
              [ "$i" = 3 ] && exit 1
              echo "pacman attempt $i failed; retrying in 30 s"; sleep 30
            done
          else
            # The distro mirror times out now and then: retry before giving up.
            for i in 1 2 3; do
              apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential curl ca-certificates git python3 && break
              [ "$i" = 3 ] && exit 1
              echo "apt attempt $i failed; retrying in 30 s"; sleep 30
            done
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: Tests (nextest names a stuck test and kills it after 120 s)
        timeout-minutes: 20
        run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc
        timeout-minutes: 10
      - run: cargo build --release
      - name: Run
        run: |
          target/release/cpuzeez -txt=out/report -json=out/report
          target/release/cpuzeez -console | head -n 60
          python3 -c "import json; d=json.load(open('out/report.json')); print([s['title'] for s in d])"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ strategy.job-index }}-distro
          path: out/

  visual:
    name: Visual regression (PR vs base, same machine)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build this PR and its base
        shell: bash
        run: |
          set -e
          cargo build --release
          cp target/release/cpuzeez.exe head.exe
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          (cd ../base && cargo build --release --target-dir "$GITHUB_WORKSPACE/target-base")
      - name: Same screens from both builds
        shell: bash
        timeout-minutes: 10
        run: |
          ./target-base/release/cpuzeez.exe -screenshots=out/base
          ./head.exe -screenshots=out/head
      - name: Compare (layout changes fail, live values don't)
        # An intended visual change is declared with the 'visual-change' label;
        # the diff is still produced and uploaded for review.
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
        run: python .github/scripts/shotdiff.py out/base out/head --max-diff 0.05
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression
          path: out/

  deb:
    name: .deb builds, installs, runs and uninstalls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-deb --locked
      - run: cargo deb
      - name: Install, run, uninstall
        run: |
          set -e
          sudo apt-get install -y ./target/debian/cpuzeez_*.deb
          cpuzeez -txt=/tmp/deb-report && test -s /tmp/deb-report.txt
          test -f /usr/share/applications/cpuzeez.desktop
          sudo apt-get remove -y cpuzeez
          test ! -e /usr/bin/cpuzeez  # not `command -v`: bash's hash table still remembers it

  msrv:
    name: Builds on the declared minimum Rust (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from Cargo.toml
        id: v
        run: echo "rust=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.v.outputs.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --workspace --locked

  deny:
    name: Dependencies (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  headless:
    name: CLI-only build (no GUI feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo build --no-default-features && ./target/debug/cpuzeez | head -n 20

  msi-upgrade:
    name: MSI install / upgrade chain / downgrade-block
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release
      - name: Version mapping self-test
        run: python .github/scripts/pkgver.py --test
      - name: Build MSIs for the chain beta.1 -> rc.1 -> snapshot.1 -> 1.0.0 -> 1.0.1 -> 1.1.0-beta.1 (same binary)
        shell: bash
        run: |
          bash .github/scripts/fetch_pawnio.sh pawnio
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          for v in 1.0.0-beta.1 1.0.0-rc.1 1.0.0-snapshot.1 1.0.0 1.0.1 1.1.0-beta.1; do
            msi=$(python .github/scripts/pkgver.py "$v" | sed -n 's/^MSI_VER=//p')
            wix build packaging/windows/cpuzeez.wxs -wx -ext WixToolset.UI.wixext -arch x64 -d Version=$msi -d Bin=target/release/cpuzeez.exe -d IconFile=assets/cpuzeez.ico -d PawnIo="$(pwd -W)/pawnio" -o cz-$v.msi
          done
      - name: Upgrade in place along the chain, refuse downgrade, uninstall cleanly
        timeout-minutes: 25
        shell: pwsh
        run: |
          function Installed { Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -in 'CpuZeeZ', 'CPU ZeeZ' } }
          function PawnIo { Test-Path HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO }
          if (PawnIo) { throw 'the runner already has PawnIO: the feature test would prove nothing' }
          foreach ($v in '1.0.0-beta.1', '1.0.0-rc.1', '1.0.0-snapshot.1', '1.0.0', '1.0.1', '1.1.0-beta.1') {
            # Hardware access is ticked by default, so a plain install brings PawnIO.
            $p = Start-Process msiexec -ArgumentList "/i cz-$v.msi /qn REBOOT=ReallySuppress /l*v i-$v.log" -Wait -PassThru; if ($p.ExitCode -notin 0, 3010) { throw "install ${v}: $($p.ExitCode)" }
            if ($v -eq '1.0.0-beta.1' -and -not (PawnIo)) { throw 'Hardware access is the default but PawnIO is not installed' }
            $e = @(Installed); "$v -> $($e.Count) entry, version $($e.DisplayVersion)"
            if ($e.Count -ne 1) { throw "after $v there are $($e.Count) entries" }
          }
          # A minor version's pre-release is 1.0.60001 to MSI (pkgver.py): above 1.0.x, below 1.1.0.
          if ($e[0].DisplayVersion -ne '1.0.60001') { throw "upgrade chain ended on the wrong version: $($e[0].DisplayVersion)" }
          # A taskbar pin copies the Start menu shortcut: its icon must outlive upgrades.
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:ProgramData\Microsoft\Windows\Start Menu\Programs\CPU ZeeZ.lnk")
          "shortcut icon: $($lnk.IconLocation)"
          if ($lnk.IconLocation -like '*\Installer\*') { throw "the shortcut's icon is in the Windows Installer cache, which an upgrade deletes" }
          foreach ($f in 'pawnio-modules\AMDFamily17.bin', 'pawnio-modules\COPYING', 'PawnIO_setup.exe', 'PresentMon.exe', 'PresentMon-LICENSE.txt', 'THIRD_PARTY.md') {
            if (-not (Test-Path "C:\Program Files\CpuZeeZ\$f")) { throw "missing $f" }
          }
          & "C:\Program Files\CpuZeeZ\cpuzeez.exe" -core=0
          $p = Start-Process msiexec -ArgumentList '/i cz-1.0.0.msi /qn REBOOT=ReallySuppress' -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw 'downgrade was not blocked' } else { "downgrade blocked ($($p.ExitCode))" }
          $p = Start-Process msiexec -ArgumentList "/x $($e[0].PSChildName) /qn REBOOT=ReallySuppress" -Wait -PassThru; if ($p.ExitCode -notin 0, 3010) { throw "uninstall: $($p.ExitCode)" }
          if (Installed) { throw 'uninstall left an entry' } else { 'uninstalled cleanly' }
          if (-not (PawnIo)) { throw 'uninstalling CpuZeeZ removed the shared PawnIO driver' }
      - name: One running copy; the update helper installs and reopens the app
        timeout-minutes: 15
        shell: pwsh
        run: |
          $exe = 'C:\Program Files\CpuZeeZ\cpuzeez.exe'
          function Copies { @(Get-Process cpuzeez -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }) }
          $p = Start-Process msiexec -ArgumentList '/i cz-1.0.0.msi /qn REBOOT=ReallySuppress' -Wait -PassThru; if ($p.ExitCode -notin 0, 3010) { throw "install: $($p.ExitCode)" }
          $app = Start-Process $exe -PassThru
          Start-Sleep 10
          # A second launch brings the first to the front and quits.
          $second = Start-Process $exe -PassThru
          if (-not $second.WaitForExit(20000)) { throw 'a second launch kept running next to the first' }
          if ((Copies).Count -ne 1) { throw "expected one copy, found $((Copies).Count)" }
          # The helper, as the app starts it: a copy of the program in the download folder.
          $dir = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\cz-update"
          Copy-Item $exe "$dir\cpuzeez-update-helper.exe"
          $msi = (Resolve-Path cz-1.0.1.msi).Path
          $started = Get-Date
          $h = Start-Process "$dir\cpuzeez-update-helper.exe" -PassThru -ArgumentList "`"--apply-update=$msi`"", "--wait-pid=$($app.Id)", "`"--relaunch=$exe`""   # quoted: the paths have spaces
          Start-Sleep 3
          if ($h.HasExited) { throw "the helper did not wait for the app (exit $($h.ExitCode))" }
          Stop-Process -Id $app.Id   # in the app, the update bar quits it through on_exit
          if (-not $h.WaitForExit(600000)) { throw 'the helper did not finish' }
          if ($h.ExitCode -ne 0) { throw "msiexec exited with $($h.ExitCode)" }
          $v = (Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -in 'CpuZeeZ', 'CPU ZeeZ' }).DisplayVersion
          if ($v -ne '1.0.1') { throw "installed version is $v" }
          Start-Sleep 10
          $after = Copies
          if ($after.Count -ne 1 -or $after[0].StartTime -lt $started) { throw "the app was not reopened once after the install ($($after.Count) copies)" }
          'reopened: pid ' + $after[0].Id
          Stop-Process -Id $after[0].Id
          $p = Start-Process msiexec -ArgumentList '/x cz-1.0.1.msi /qn REBOOT=ReallySuppress' -Wait -PassThru; if ($p.ExitCode -notin 0, 3010) { throw "uninstall: $($p.ExitCode)" }

  msi-releases:
    name: MSI upgrade from every published release, optional driver, clean removal
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release
      - name: Build this commit's MSI and download the published ones
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          head=$(cargo pkgid | sed 's/.*[#@]//')
          echo "head version $head"
          bash .github/scripts/fetch_pawnio.sh pawnio
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          msi=$(python .github/scripts/pkgver.py "$head" | sed -n 's/^MSI_VER=//p')
          wix build packaging/windows/cpuzeez.wxs -wx -ext WixToolset.UI.wixext -arch x64 -d Version=$msi -d Bin=target/release/cpuzeez.exe -d IconFile=assets/cpuzeez.ico -d PawnIo="$(pwd -W)/pawnio" -o head.msi
          mkdir published
          # Every 1.x pre-release or release with an MSI, oldest first, except this very version.
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' | grep '^v1\.' | sort -V); do
            [ "$tag" = "v$head" ] && continue
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p '*-windows-x64.msi' -D published 2>/dev/null || echo "no MSI in $tag"
          done
          ls published
      - name: Upgrade through every published release to this commit, then remove
        timeout-minutes: 30
        shell: pwsh
        run: |
          function Installed { Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* | Where-Object { $_.DisplayName -in 'CpuZeeZ', 'CPU ZeeZ' } }
          function PawnIo { Test-Path HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO }
          # Never let an install reboot the runner (an /qn install may restart Windows when a
          # file is in use, and the runner drops off). 3010 = done, restart pending: success.
          function Msi($args_) { $p = Start-Process msiexec -ArgumentList "$args_ REBOOT=ReallySuppress" -Wait -PassThru; if ($p.ExitCode -eq 3010) { 0 } else { $p.ExitCode } }
          $dir = 'C:\Program Files\CpuZeeZ'
          if (PawnIo) { throw 'the runner already has PawnIO: the feature test would prove nothing' }

          # 1. Optional component: leaving "Hardware access" out installs the app and no driver.
          if (Msi '/i head.msi ADDLOCAL=Main /qn') { throw 'install without the driver failed' }
          if (PawnIo) { throw 'ADDLOCAL=Main still installed the PawnIO driver' }
          if (-not (Test-Path "$dir\cpuzeez.exe")) { throw 'the app is missing without the driver' }
          & "$dir\cpuzeez.exe" -core=0
          if (Msi "/x $((Installed).PSChildName) /qn") { throw 'removal failed' }

          # 2. Clean removal: no folder, no shortcut, no PATH entry; the user's data stays.
          New-Item -ItemType Directory -Force "$env:APPDATA\CpuZeeZ" | Out-Null
          Set-Content "$env:APPDATA\CpuZeeZ\settings.json" '{}'
          if (Msi '/i head.msi ADDLOCAL=Main /qn') { throw 'reinstall failed' }
          $id = (Installed).PSChildName
          if (Msi "/x $id /qn") { throw 'removal failed' }
          if (Installed) { throw 'removal left an uninstall entry' }
          if (Test-Path $dir) { throw "removal left $dir : $((Get-ChildItem $dir -Recurse -Name) -join ', ')" }
          if (Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Include 'CpuZeeZ*.lnk', 'CPU ZeeZ*.lnk') { throw 'removal left the Start menu shortcut' }
          if (([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';') -contains $dir) { throw 'removal left the PATH entry' }
          if (-not (Test-Path "$env:APPDATA\CpuZeeZ\settings.json")) { throw 'removal deleted the user data' }

          # 3. Upgrade in place from every published release, oldest first, ending on this commit.
          # Numbers compare as numbers: beta.2 before beta.10.
          $chain = @(Get-ChildItem published -Filter *.msi | Sort-Object { [regex]::Replace($_.Name, '\d+', { param($m) $m.Value.PadLeft(6, '0') }) })
          foreach ($m in $chain + (Get-Item head.msi)) {
            $code = Msi "/i $($m.FullName) ADDLOCAL=Main /qn /l*v i-$($m.BaseName).log"
            if ($code) { throw "installing $($m.Name): exit $code" }
            $e = @(Installed)
            "$($m.Name) -> $($e.Count) entry, version $($e.DisplayVersion)"
            if ($e.Count -ne 1) { throw "after $($m.Name) there are $($e.Count) entries" }
          }
          & "$dir\cpuzeez.exe" -core=0
          if (Msi "/x $((Installed).PSChildName) /qn") { throw 'final removal failed' }
          if (Installed) { throw 'final removal left an entry' }
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-releases-logs
          path: i-*.log
          if-no-files-found: ignore
