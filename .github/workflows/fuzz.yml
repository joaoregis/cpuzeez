name: Fuzz

# Coverage-guided fuzzing of the untrusted-input parsers (S0-T07), nightly
# and on demand. Crashes are uploaded as artifacts with the input that broke.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Read-only token: nothing here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [elevated_op, layout_json, smbios, spd, edid, pci_config, presentmon_csv, output_lines, hw_csv, session_json, detector]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz for 5 minutes
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/
