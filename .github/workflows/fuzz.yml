name: Fuzz

# Coverage-guided fuzzing of the untrusted-input parsers (S0-T07), nightly
# and on demand. Crashes are uploaded as artifacts with the input that broke.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per target (the long campaign: 60 or more; a job stops at 6 h)"
        default: "5"

# Read-only token: nothing here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    # The run itself plus building cargo-fuzz and the target.
    timeout-minutes: ${{ fromJSON(inputs.minutes || '5') + 30 }}
    strategy:
      fail-fast: false
      matrix:
        target: [elevated_op, layout_json, smbios, spd, edid, pci_config, presentmon_csv, output_lines, hw_csv, session_json, detector]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz (5 minutes scheduled; on demand, the minutes asked for)
        env:
          MINUTES: ${{ inputs.minutes || '5' }}
        run: |
          set -o pipefail  # a crash must fail the step through the tee
          case "$MINUTES" in ''|*[!0-9]*) echo "minutes must be a number"; exit 1;; esac
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=$((MINUTES * 60)) -print_final_stats=1 2>&1 | tee fuzz.log
          # Target, duration and executions, for docs/security/fuzz-results.md.
          echo "### ${{ matrix.target }}: $MINUTES min, $(grep -o 'stat::number_of_executed_units: *[0-9]*' fuzz.log | grep -o '[0-9]*$') executions" >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/
      # The corpus the run grew, to fold back into fuzz/corpus/ after a long campaign.
      - if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
