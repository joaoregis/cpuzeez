[package]
name = "cpuzeez-core"
version = "1.0.2"
edition = "2024"
rust-version = "1.95"
description = "CpuZeeZ domain types and pure logic: decoders and the report model. No OS calls, no GUI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/joaoregis/cpuzeez"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
