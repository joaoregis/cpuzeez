[package]
name = "cpuzeez-platform"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "CpuZeeZ per-OS adapters: OS helpers, CPUID and the privileged hardware backends (PawnIO, Linux kernel interfaces)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/joaoregis/cpuzeez"
publish = false

[dependencies]
cpuzeez-core = { path = "../core" }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

# Official Microsoft bindings for new Win32 code (docs/adr/0006); already in
# the lock file through winit.
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_TpmBaseServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
